[package]
name = "rdmc-fit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
rand = "0.10.3"
rand_distr = "0.6.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
criterion = "0.8.2"

[profile.release]
opt-level = 3 # max optimizing, all optimizations
lto = "fat" # perform optimizations across all crates within the dependency graph
codegen-units = 1 # how many code generation units a crate will be split into
panic = "abort" # terminate process upon panic


